<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AstaChamma</title>

    <!-- ========================================================
         STYLES
         ======================================================== -->

    <link rel="stylesheet" href="style/board.css">
    <link rel="stylesheet" href="style/ui.css">

    <style>
        /* =====================================================
           PAGE / GAME SHELL
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(255, 194, 92, 0.10),
                    transparent 32%
                ),
                linear-gradient(
                    145deg,
                    #090909,
                    #17110c 48%,
                    #080808
                );
            color: #f6ead2;
        }

        button {
            font: inherit;
        }

        .game-app {
            width: min(1500px, 100%);
            margin: 0 auto;
            padding: 20px;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 22px;
            margin-bottom: 18px;

            border: 1px solid rgba(218, 168, 76, 0.35);
            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(52, 27, 13, 0.95),
                    rgba(17, 14, 11, 0.96)
                );

            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .brand h1 {
            margin: 0;
            font-family: "Cinzel", serif;
            font-size: clamp(1.7rem, 4vw, 2.7rem);
            letter-spacing: 0.12em;
            color: #f2c66d;
        }

        .brand p {
            margin: 3px 0 0;
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(246, 234, 210, 0.62);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* =====================================================
           MAIN LAYOUT
           ===================================================== */

        .game-layout {
            display: grid;
            grid-template-columns:
                minmax(190px, 240px)
                minmax(460px, 1fr)
                minmax(190px, 240px);
            gap: 18px;
            align-items: stretch;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .panel {
            border: 1px solid rgba(218, 168, 76, 0.28);
            border-radius: 16px;
            background:
                linear-gradient(
                    145deg,
                    rgba(37, 25, 17, 0.96),
                    rgba(15, 13, 11, 0.96)
                );
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.035);
            overflow: hidden;
        }

        .panel-title {
            padding: 11px 14px;
            border-bottom: 1px solid rgba(218, 168, 76, 0.16);

            font-family: "Cinzel", serif;
            font-size: 0.86rem;
            letter-spacing: 0.08em;
            color: #e9bd62;
        }

        .panel-body {
            padding: 14px;
        }

        /* =====================================================
           PLAYER CARDS
           ===================================================== */

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .player-card {
            position: relative;
            padding: 11px 12px;

            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;

            background: rgba(255,255,255,0.025);

            transition:
                transform 0.18s ease,
                border-color 0.18s ease,
                background 0.18s ease;
        }

        .player-card.current {
            transform: translateX(3px);
            border-color: rgba(242, 198, 109, 0.65);
            background: rgba(242, 198, 109, 0.08);
            box-shadow:
                0 0 18px rgba(242, 198, 109, 0.08);
        }

        .player-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .player-name {
            display: flex;
            align-items: center;
            gap: 8px;

            font-family: "Cinzel", serif;
            font-size: 0.86rem;
            font-weight: 600;
        }

        .player-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex: 0 0 auto;

            box-shadow:
                0 0 10px currentColor;
        }

        .player-dot.red {
            color: #e53935;
            background: #e53935;
        }

        .player-dot.blue {
            color: #42a5f5;
            background: #42a5f5;
        }

        .player-dot.green {
            color: #66bb6a;
            background: #66bb6a;
        }

        .player-dot.yellow {
            color: #ffd54f;
            background: #ffd54f;
        }

        .player-rank {
            min-width: 25px;
            height: 25px;
            display: none;
            place-items: center;
            border-radius: 50%;

            background: rgba(242, 198, 109, 0.12);
            border: 1px solid rgba(242, 198, 109, 0.35);

            font-size: 0.7rem;
            color: #f2c66d;
        }

        .player-card.finished .player-rank {
            display: grid;
        }

        .player-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            margin-top: 8px;
        }

        .stat {
            padding: 5px 7px;
            border-radius: 7px;
            background: rgba(0,0,0,0.2);
            color: rgba(246,234,210,0.68);
            font-size: 0.68rem;
        }

        .stat strong {
            display: block;
            margin-top: 1px;
            color: #f5e3be;
            font-size: 0.78rem;
        }

        /* =====================================================
           BOARD AREA
           ===================================================== */

        .board-panel {
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(12px, 2vw, 24px);

            border: 1px solid rgba(218, 168, 76, 0.3);
            border-radius: 20px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(135, 74, 23, 0.12),
                    transparent 60%
                ),
                rgba(9, 8, 7, 0.82);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.38),
                inset 0 1px 0 rgba(255,255,255,0.035);
        }

        #astachamma-board {
            position: relative;
            width: min(100%, 700px);
            aspect-ratio: 1 / 1;

            display: grid;
            place-items: center;
        }

        /*
         * The logical route numbers are deliberately NOT
         * rendered. They remain engine-only identifiers.
         */

        .board-grid {
            position: relative;
            width: min(100%, 620px);
            aspect-ratio: 1 / 1;

            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);

            gap: 5px;
            padding: 7px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    #5d3518,
                    #1a110b
                );

            border: 2px solid rgba(220, 174, 91, 0.42);

            box-shadow:
                0 22px 50px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .board-cell {
            position: relative;
            min-width: 0;
            min-height: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.08);

            background:
                linear-gradient(
                    145deg,
                    rgba(74, 47, 27, 0.9),
                    rgba(28, 21, 15, 0.95)
                );

            overflow: visible;
        }

        .board-cell.path-outer {
            background:
                linear-gradient(
                    145deg,
                    rgba(116, 25, 20, 0.88),
                    rgba(52, 15, 14, 0.95)
                );
        }

        .board-cell.path-inner {
            background:
                linear-gradient(
                    145deg,
                    rgba(19, 65, 112, 0.92),
                    rgba(9, 32, 61, 0.96)
                );
        }

        .board-cell.safe {
            background:
                linear-gradient(
                    145deg,
                    rgba(35, 111, 52, 0.95),
                    rgba(12, 57, 25, 0.96)
                );

            box-shadow:
                inset 0 0 0 1px rgba(108, 224, 117, 0.18);
        }

        .board-cell.core {
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 38% 32%,
                    #fff0a8,
                    #dba947 35%,
                    #7e4e12 72%,
                    #321b06
                );

            border: 3px solid rgba(255, 225, 140, 0.7);

            box-shadow:
                0 0 25px rgba(242, 198, 109, 0.35),
                inset 0 2px 5px rgba(255,255,255,0.4);
        }

        .core-label {
            font-family: "Cinzel", serif;
            font-weight: 700;
            font-size: clamp(0.62rem, 1.4vw, 0.95rem);
            letter-spacing: 0.1em;
            color: #3b2207;
            text-shadow: 0 1px rgba(255,255,255,0.3);
        }

        /* =====================================================
           PIECES
           ===================================================== */

        .piece {
            position: relative;
            z-index: 5;

            width: 60%;
            aspect-ratio: 1;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            border: 2px solid rgba(255,255,255,0.48);

            font-family: "Cinzel", serif;
            font-weight: 700;
            font-size: clamp(0.52rem, 1.5vw, 0.82rem);

            box-shadow:
                0 4px 8px rgba(0,0,0,0.5),
                inset 0 1px 2px rgba(255,255,255,0.28);

            transition:
                transform 0.16s ease,
                filter 0.16s ease,
                box-shadow 0.16s ease;
        }

        .piece:hover {
            transform: scale(1.08);
            filter: brightness(1.14);
        }

        .piece.knight::before {
            content: "♞";
            font-size: 1.1em;
        }

        .piece.king::before {
            content: "♛";
            font-size: 1.1em;
        }

        .piece.red {
            background:
                radial-gradient(circle at 35% 30%, #ff827a, #c52d29 55%, #67100f);
        }

        .piece.blue {
            background:
                radial-gradient(circle at 35% 30%, #9bd7ff, #297cc0 55%, #0c355b);
        }

        .piece.green {
            background:
                radial-gradient(circle at 35% 30%, #b5edb9, #369345 55%, #123e1a);
        }

        .piece.yellow {
            background:
                radial-gradient(circle at 35% 30%, #fff2a1, #d9a92e 55%, #684908);
        }

        .piece.selected {
            transform: scale(1.13);
            border-color: #fff1ad;
            box-shadow:
                0 0 0 4px rgba(242,198,109,0.2),
                0 0 22px rgba(242,198,109,0.65);
        }

        .piece.movable {
            animation: piecePulse 1.1s infinite;
        }

        @keyframes piecePulse {
            0%, 100% {
                box-shadow:
                    0 4px 8px rgba(0,0,0,0.5),
                    0 0 0 rgba(242,198,109,0);
            }

            50% {
                box-shadow:
                    0 4px 8px rgba(0,0,0,0.5),
                    0 0 18px rgba(242,198,109,0.72);
            }
        }

        .destination-marker {
            position: absolute;
            inset: 10%;
            border-radius: 50%;
            pointer-events: none;

            border: 2px dashed rgba(255, 230, 145, 0.9);
            box-shadow:
                0 0 16px rgba(255, 214, 96, 0.45);

            animation: destinationPulse 1s infinite;
        }

        @keyframes destinationPulse {
            50% {
                transform: scale(1.08);
                opacity: 0.55;
            }
        }

        /* =====================================================
           GAVVA PANEL
           ===================================================== */

        .gavva-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .gavva-cups {
            display: flex;
            justify-content: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .gavva {
            width: 34px;
            height: 34px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            border: 2px solid rgba(238, 198, 116, 0.5);

            background:
                radial-gradient(
                    circle at 35% 28%,
                    #fff7db,
                    #c6a56d 46%,
                    #60451e
                );

            color: #3d270d;

            font-size: 0.8rem;
            font-weight: 700;

            box-shadow:
                0 4px 9px rgba(0,0,0,0.45),
                inset 0 1px 2px rgba(255,255,255,0.6);
        }

        .gavva.closed {
            background:
                radial-gradient(
                    circle at 35% 28%,
                    #6e5131,
                    #302116 60%,
                    #110c08
                );
            color: rgba(255,255,255,0.35);
        }

        .roll-result {
            width: 100%;
            text-align: center;
        }

        .roll-result-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: rgba(246,234,210,0.5);
        }

        .roll-result-value {
            margin-top: 1px;
            font-family: "Cinzel", serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #f2c66d;
            line-height: 1;
        }

        /* =====================================================
           CONTROLS
           ===================================================== */

        .control-stack {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .game-button {
            width: 100%;
            padding: 10px 13px;

            border: 1px solid rgba(218,168,76,0.35);
            border-radius: 10px;

            background:
                linear-gradient(
                    145deg,
                    rgba(101, 59, 22, 0.95),
                    rgba(44, 27, 13, 0.96)
                );

            color: #f8e6bd;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                filter 0.15s ease,
                border-color 0.15s ease;
        }

        .game-button:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.12);
            border-color: rgba(242,198,109,0.72);
        }

        .game-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .game-button:disabled {
            opacity: 0.38;
            cursor: not-allowed;
        }

        .game-button.primary {
            padding: 13px;
            font-family: "Cinzel", serif;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #2e1b06;

            background:
                linear-gradient(
                    145deg,
                    #ffe49b,
                    #d59b35
                );

            border-color: #f2c66d;
        }

        .game-button.danger {
            background:
                linear-gradient(
                    145deg,
                    rgba(123, 31, 25, 0.95),
                    rgba(52, 14, 13, 0.96)
                );
        }

        .split-button {
            display: none;
        }

        .split-button.visible {
            display: block;
        }

        /* =====================================================
           STATUS
           ===================================================== */

        .status-box {
            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 12px;

            text-align: center;

            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.07);

            background: rgba(0,0,0,0.22);

            color: #f4dfb2;
            font-size: 0.78rem;
            line-height: 1.45;
        }

        .status-box.success {
            border-color: rgba(91, 190, 103, 0.42);
            color: #a9e7ae;
        }

        .status-box.warning {
            border-color: rgba(236, 177, 68, 0.42);
            color: #f5d28c;
        }

        .status-box.error {
            border-color: rgba(218, 70, 65, 0.42);
            color: #f2a6a2;
        }

        /* =====================================================
           TURN INDICATOR
           ===================================================== */

        .turn-indicator {
            width: 100%;
            margin-top: 10px;

            padding: 9px 12px;

            border-radius: 10px;

            text-align: center;

            font-family: "Cinzel", serif;
            font-size: 0.76rem;
            letter-spacing: 0.08em;

            background: rgba(242,198,109,0.07);
            border: 1px solid rgba(242,198,109,0.2);
            color: #eecb82;
        }

        /* =====================================================
           CHUNK SELECTION
           ===================================================== */

        .chunk-area {
            display: none;
            gap: 7px;
            flex-wrap: wrap;
        }

        .chunk-area.visible {
            display: flex;
        }

        .chunk-button {
            flex: 1 1 55px;
            padding: 8px;

            border-radius: 8px;
            border: 1px solid rgba(242,198,109,0.28);

            background: rgba(242,198,109,0.06);
            color: #e9cb8d;

            cursor: pointer;
        }

        .chunk-button:hover {
            background: rgba(242,198,109,0.14);
        }

        .chunk-button.selected {
            background: rgba(242,198,109,0.2);
            border-color: rgba(242,198,109,0.65);
        }

        /* =====================================================
           START OVERLAY
           ===================================================== */

        .start-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(77,43,15,0.22),
                    rgba(0,0,0,0.86)
                );

            backdrop-filter: blur(5px);
        }

        .start-overlay.hidden {
            display: none;
        }

        .start-card {
            width: min(500px, 100%);
            padding: 30px;

            border: 1px solid rgba(242,198,109,0.38);
            border-radius: 22px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #29190e,
                    #0f0c09
                );

            box-shadow:
                0 30px 90px rgba(0,0,0,0.7);
        }

        .start-card h2 {
            margin: 0;

            font-family: "Cinzel", serif;
            font-size: clamp(1.8rem, 6vw, 3rem);
            color: #f2c66d;
        }

        .start-card p {
            margin: 10px auto 24px;
            max-width: 390px;

            color: rgba(246,234,210,0.68);
            line-height: 1.65;
            font-size: 0.84rem;
        }

        .player-count {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .player-count button {
            min-width: 52px;
            padding: 9px;

            border-radius: 9px;
            border: 1px solid rgba(242,198,109,0.25);

            background: rgba(242,198,109,0.05);
            color: #e9cb8d;

            cursor: pointer;
        }

        .player-count button.selected {
            background: rgba(242,198,109,0.18);
            border-color: rgba(242,198,109,0.65);
        }

        /* =====================================================
           WINNER MODAL
           ===================================================== */

        .result-overlay {
            position: fixed;
            inset: 0;
            z-index: 1100;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0,0,0,0.82);
            backdrop-filter: blur(5px);
        }

        .result-overlay.visible {
            display: flex;
        }

        .result-card {
            width: min(520px, 100%);
            padding: 30px;

            text-align: center;

            border-radius: 20px;
            border: 1px solid rgba(242,198,109,0.42);

            background:
                linear-gradient(
                    145deg,
                    #2b1a0d,
                    #100c08
                );

            box-shadow: 0 30px 90px rgba(0,0,0,0.7);
        }

        .result-card h2 {
            margin: 0 0 12px;
            font-family: "Cinzel", serif;
            color: #f2c66d;
        }

        .ranking {
            margin: 18px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ranking-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 10px 13px;

            border-radius: 9px;
            background: rgba(255,255,255,0.035);
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 1050px) {
            .game-layout {
                grid-template-columns:
                    minmax(160px, 200px)
                    minmax(400px, 1fr);
            }

            .right-panel {
                grid-column: 1 / -1;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 760px) {
            .game-app {
                padding: 10px;
            }

            .game-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .header-actions {
                justify-content: center;
            }

            .game-layout {
                display: flex;
                flex-direction: column;
            }

            .left-panel,
            .right-panel {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .player-panel {
                grid-column: 1 / -1;
            }

            .board-panel {
                order: -1;
            }

            .side-panel {
                width: 100%;
            }

            .panel {
                min-width: 0;
            }
        }

        @media (max-width: 500px) {
            .left-panel,
            .right-panel {
                display: flex;
            }

            .brand p {
                font-size: 0.62rem;
            }

            .board-grid {
                gap: 3px;
                padding: 4px;
            }

            .piece {
                width: 68%;
                border-width: 1px;
            }

            .gavva {
                width: 29px;
                height: 29px;
            }
        }
    </style>
</head>

<body>

<div class="game-app">

    <!-- ========================================================
         HEADER
         ======================================================== -->

    <header class="game-header">

        <div class="brand">
            <h1>AstaChamma</h1>
            <p>Gavva • Strategy • Tradition</p>
        </div>

        <div class="header-actions">
            <button
                id="new-game-button"
                class="game-button"
                type="button"
            >
                New Game
            </button>
        </div>

    </header>


    <!-- ========================================================
         MAIN GAME
         ======================================================== -->

    <main class="game-layout">

        <!-- ====================================================
             LEFT PANEL
             ==================================================== -->

        <aside class="side-panel left-panel">

            <section class="panel player-panel">

                <div class="panel-title">
                    Players
                </div>

                <div class="panel-body">

                    <div
                        id="player-list"
                        class="player-list"
                    ></div>

                </div>

            </section>

        </aside>


        <!-- ====================================================
             BOARD
             ==================================================== -->

        <section class="board-panel">

            <div
                id="turn-indicator"
                class="turn-indicator"
            >
                Red's turn
            </div>

            <div id="astachamma-board"></div>

        </section>


        <!-- ====================================================
             RIGHT PANEL

<!-- ============================================================
     MODULAR GAME ENGINE
     ============================================================

     Dependency order:

         state
           ↓
         coins
           ↓
        gameplay
           ↓
         rules
           ↓
         core
           ↓
         UI
     ============================================================ -->

<script src="app/state.js"></script>
<script src="engine/coins.js"></script>
<script src="engine/gameplay.js"></script>
<script src="engine/rules.js"></script>
<script src="app/core.js"></script>


<!-- ============================================================
     UI CONTROLLER
     ============================================================ -->

<script>
"use strict";


/* ============================================================
   UI STATE
   ============================================================ */

const UI = {

    selectedPlayerCount: 4,

    selectedChunk: null,

    lastRoll: null,

    lastCoins: [],

    destinationElements: [],

    gameStarted: false

};


/* ============================================================
   ENGINE REFERENCES
   ============================================================ */

const State =
    window.AstaChammaState;

const Core =
    window.AstaChammaCore;

const Gameplay =
    window.AstaChammaGameplay;

const Rules =
    window.AstaChammaRules;

const Coins =
    window.AstaChammaCoins;


/* ============================================================
   DOM REFERENCES
   ============================================================ */

const boardElement =
    document.getElementById(
        "astachamma-board"
    );

const playerListElement =
    document.getElementById(
        "player-list"
    );

const rollButton =
    document.getElementById(
        "roll-button"
    );

const splitButton =
    document.getElementById(
        "split-button"
    );

const chunkArea =
    document.getElementById(
        "chunk-area"
    );

const rollResult =
    document.getElementById(
        "roll-result"
    );

const gavvaCups =
    document.getElementById(
        "gavva-cups"
    );

const statusBox =
    document.getElementById(
        "status-box"
    );

const turnIndicator =
    document.getElementById(
        "turn-indicator"
    );

const startOverlay =
    document.getElementById(
        "start-overlay"
    );

const resultOverlay =
    document.getElementById(
        "result-overlay"
    );

const rankingElement =
    document.getElementById(
        "ranking"
    );

const winnerMessage =
    document.getElementById(
        "winner-message"
    );


/* ============================================================
   BOARD DEFINITION
   ============================================================

   This is presentation geometry only.

   Logical route identifiers are NOT displayed.

   The finalized logical board is:

       15 16  1  2  3
       14 17 18 19  4
       13 24 CORE 20 5
       12 23 22 21  6
       11 10  9  8  7

   The UI maps those logical positions onto cells.
   ============================================================ */

const BOARD_LAYOUT = [

    [15, 16, 1, 2, 3],

    [14, 17, 18, 19, 4],

    [13, 24, 25, 20, 5],

    [12, 23, 22, 21, 6],

    [11, 10, 9, 8, 7]

];


/* ============================================================
   SAFE POSITIONS
   ============================================================ */

const SAFE_POSITIONS =
    new Set([
        1,
        5,
        9,
        13,
        18,
        20,
        22,
        24
    ]);


/* ============================================================
   BOARD CELL MAP
   ============================================================ */

const boardCells =
    new Map();


/* ============================================================
   BUILD BOARD
   ============================================================ */

function buildBoard() {

    boardElement.innerHTML = "";

    const grid =
        document.createElement("div");

    grid.className =
        "board-grid";

    BOARD_LAYOUT.forEach(
        row => {

            row.forEach(
                logicalPosition => {

                    const cell =
                        document.createElement("div");

                    cell.className =
                        "board-cell";

                    cell.dataset.position =
                        logicalPosition;

                    if (
                        logicalPosition === 25
                    ) {

                        cell.classList.add(
                            "core"
                        );

                        cell.innerHTML =
                            `
                            <span class="core-label">
                                CORE
                            </span>
                            `;

                    } else {

                        if (
                            SAFE_POSITIONS.has(
                                logicalPosition
                            )
                        ) {

                            cell.classList.add(
                                "safe"
                            );

                        } else {

                            cell.classList.add(
                                "path-outer"
                            );

                        }

                    }

                    boardCells.set(
                        logicalPosition,
                        cell
                    );

                    grid.appendChild(cell);

                }
            );

        }
    );

    boardElement.appendChild(grid);

}


/* ============================================================
   PLAYER COLORS
   ============================================================ */

const PLAYER_COLORS = {

    red: {
        name: "Red",
        css: "red"
    },

    blue: {
        name: "Blue",
        css: "blue"
    },

    green: {
        name: "Green",
        css: "green"
    },

    yellow: {
        name: "Yellow",
        css: "yellow"
    }

};


/* ============================================================
   ACTIVE PLAYER COUNT
   ============================================================ */

function getParticipatingPlayers() {

    /*
     * The current state object contains four players.
     *
     * Until the engine exposes an explicit player-count
     * mutation, the UI keeps the standard four-player state.
     *
     * The selection UI is retained for future integration.
     */

    return State.PLAYERS;

}


/* ============================================================
   RENDER PLAYERS
   ============================================================ */

function renderPlayers() {

    const state =
        State.getGameState();

    playerListElement.innerHTML = "";

    getParticipatingPlayers().forEach(
        color => {

            const player =
                state.players[color];

            const card =
                document.createElement("div");

            card.className =
                "player-card";

            if (
                state.currentPlayer === color &&
                !state.gameOver
            ) {

                card.classList.add(
                    "current"
                );

            }

            if (
                player.corePieces >=
                State.PIECES_PER_PLAYER
            ) {

                card.classList.add(
                    "finished"
                );

            }

            card.innerHTML = `
                <div class="player-card-top">

                    <div class="player-name">

                        <span
                            class="player-dot ${color}"
                        ></span>

                        <span>
                            ${PLAYER_COLORS[color].name}
                        </span>

                    </div>

                    <div class="player-rank">
                        ${player.corePieces}
                    </div>

                </div>

                <div class="player-stats">

                    <div class="stat">
                        Core
                        <strong>
                            ${player.corePieces}/4
                        </strong>
                    </div>

                    <div class="stat">
                        Captures
                        <strong>
                            ${player.captures}
                        </strong>
                    </div>

                </div>
            `;

            playerListElement.appendChild(
                card
            );

        }
    );

}


/* ============================================================
   PIECE HTML
   ============================================================ */

function createPieceElement(
    playerColor,
    piece
) {

    const element =
        document.createElement("button");

    element.type = "button";

    element.className =
        `piece ${playerColor} ${piece.type}`;

    element.dataset.player =
        playerColor;

    element.dataset.pieceId =
        piece.id;

    element.title =
        `${PLAYER_COLORS[playerColor].name} ${piece.type}`;

    if (
        piece.type === "king"
    ) {

        element.setAttribute(
            "aria-label",
            `${PLAYER_COLORS[playerColor].name} King`
        );

    } else {

        element.setAttribute(
            "aria-label",
            `${PLAYER_COLORS[playerColor].name} Knight`
        );

    }

    element.addEventListener(
        "click",
        () => {

            selectPiece(
                playerColor,
                piece.id
            );

        }
    );

    return element;

}


/* ============================================================
   RENDER PIECES
   ============================================================ */

function renderPieces() {

    boardCells.forEach(
        cell => {

            /*
             * Preserve CORE label.
             */

            if (
                cell.dataset.position !== "25"
            ) {

                cell.innerHTML = "";

            }

        }
    );

    const state =
        State.getGameState();

    State.PLAYERS.forEach(
        color => {

            const player =
                state.players[color];

            player.pieces.forEach(
                piece => {

                    if (
                        piece.status !==
                        State.PIECE_STATUS.ACTIVE
                    ) {

                        return;

                    }

                    if (
                        piece.position === null
                    ) {

                        return;

                    }

                    const cell =
                        boardCells.get(
                            piece.position
                        );

                    if (!cell) {
                        return;
                    }

                    /*
                     * Core pieces are considered finished.
                     * They are not placed as normal board pieces.
                     */

                    if (
                        piece.position ===
                        State.CORE_POSITION
                    ) {

                        return;

                    }

                    const element =
                        createPieceElement(
                            color,
                            piece
                        );

                    if (
                        state.selectedPieceId ===
                        piece.id &&
                        state.currentPlayer ===
                        color
                    ) {

                        element.classList.add(
                            "selected"
                        );

                    }

                    cell.appendChild(
                        element
                    );

                }
            );

        }
    );

}


/* ============================================================
   RENDER MOVABLE PIECES
   ============================================================ */

function highlightMovablePieces() {

    const state =
        State.getGameState();

    if (
        !state.hasRolled
    ) {

        return;

    }

    const player =
        state.players[
            state.currentPlayer
        ];

    if (!player) {
        return;
    }

    /*
     * Ask the engine for legal actions where possible.
     */

    let actions = [];

    try {

        if (
            typeof Core.getAllAvailableActions ===
            "function"
        ) {

            actions =
                Core.getAllAvailableActions() ||
                [];

        }

    } catch (error) {

        console.warn(
            "Could not obtain available actions:",
            error
        );

    }

    /*
     * If the engine exposes piece actions,
     * use those to highlight selectable pieces.
     */

    if (
        Array.isArray(actions)
    ) {

        actions.forEach(
            action => {

                const pieceId =
                    action.pieceId;

                if (!pieceId) {
                    return;
                }

                const element =
                    document.querySelector(
                        `.piece[data-player="${state.currentPlayer}"][data-piece-id="${pieceId}"]`
                    );

                if (element) {

                    element.classList.add(
                        "movable"
                    );

                }

            }
        );

    }

}


/* ============================================================
   CLEAR DESTINATIONS
   ============================================================ */

function clearDestinations() {

    UI.destinationElements.forEach(
        element => {

            element.remove();

        }
    );

    UI.destinationElements = [];

}


/* ============================================================
   SHOW AVAILABLE DESTINATIONS
   ============================================================ */

function showAvailableDestinations() {

    clearDestinations();

    const state =
        State.getGameState();

    if (
        !state.selectedPieceId
    ) {

        return;

    }

    if (
        !Array.isArray(
            state.availableMoves
        )
    ) {

        return;

    }

    state.availableMoves.forEach(
        position => {

            const cell =
                boardCells.get(
                    position
                );

            if (!cell) {
                return;
            }

            const marker =
                document.createElement(
                    "span"
                );

            marker.className =
                "destination-marker";

            cell.appendChild(
                marker
            );

            UI.destinationElements.push(
                marker
            );

        }
    );

}


/* ============================================================
   SELECT PIECE
   ============================================================ */

function selectPiece(
    playerColor,
    pieceId
) {

    const state =
        State.getGameState();

    if (
        !state.started ||
        state.gameOver
    ) {

        return;

    }

    if (
        state.currentPlayer !==
        playerColor
    ) {

        setStatus(
            "It is not this player's turn.",
            "warning"
        );

        return;

    }

    if (
        !state.hasRolled
    ) {

        setStatus(
            "Cast the gavva first.",
            "warning"
        );

        return;

    }

    try {

        const result =
            Core.selectPiece(
                playerColor,
                pieceId
            );

        if (
            result === false
        ) {

            setStatus(
                "That piece cannot be selected for this roll.",
                "warning"
            );

            return;

        }

        setStatus(
            "Piece selected. Choose a highlighted destination.",
            "success"
        );

        render();

        showAvailableDestinations();

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message ||
            "Unable to select that piece.",
            "error"
        );

    }

}


/* ============================================================
   DESTINATION CLICK
   ============================================================ */

function setupDestinationHandling() {

    boardCells.forEach(
        cell => {

            cell.addEventListener(
                "click",
                () => {

                    const position =
                        Number(
                            cell.dataset.position
                        );

                    attemptMoveTo(
                        position
                    );

                }
            );

        }
    );

}


/* ============================================================
   MOVE
   ============================================================ */

function attemptMoveTo(
    position
) {

    const state =
        State.getGameState();

    if (
        !state.started ||
        state.gameOver
    ) {

        return;

    }

    if (
        !state.selectedPieceId
    ) {

        return;

    }

    if (
        !state.availableMoves.includes(
            position
        )
    ) {

        return;

    }

    try {

        const result =
            Core.movePiece(
                state.currentPlayer,
                state.selectedPieceId,
                position
            );

        if (
            result === false
        ) {

            setStatus(
                "That destination is not legal.",
                "warning"
            );

            return;

        }

        clearDestinations();

        setStatus(
            "Move completed.",
            "success"
        );

        render();

        handlePostAction();

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message ||
            "The move could not be completed.",
            "error"
        );

    }

}


/* ============================================================
   ROLL GAVVA
   ============================================================ */

function handleRoll() {

    const state =
        State.getGameState();

    if (
        !state.started ||
        state.gameOver
    ) {

        return;

    }

    if (
        state.hasRolled
    ) {

        setStatus(
            "Resolve the current roll before casting again.",
            "warning"
        );

        return;

    }

    try {

        const result =
            Core.rollGavva();

        if (!result) {

            setStatus(
                "The gavva could not be cast.",
                "error"
            );

            return;

        }

        UI.lastRoll =
            result.roll;

        UI.lastCoins =
            result.gavva ||
            result.coins ||
            [];

        renderGavva(
            UI.lastCoins,
            result.roll
        );

        render();

        handleRollOptions();

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message ||
            "Unable to cast the gavva.",
            "error"
        );

    }

}


/* ============================================================
   GAVVA DISPLAY
   ============================================================ */

function renderGavva(
    gavva,
    roll
) {

    gavvaCups.innerHTML = "";

    if (
        !Array.isArray(gavva) ||
        gavva.length === 0
    ) {

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "gavva closed";

            element.textContent =
                "?";

            gavvaCups.appendChild(
                element
            );

        }

    } else {

        gavva.forEach(
            value => {

                const element =
                    document.createElement(
                        "div"
                    );

                const isOpen =
                    value === 1 ||
                    value === true ||
                    value === "1" ||
                    value === "H" ||
                    value === "h";

                element.className =
                    `gavva ${
                        isOpen
                            ? ""
                            : "closed"
                    }`;

                element.textContent =
                    isOpen
                        ? "H"
                        : "T";

                gavvaCups.appendChild(
                    element
                );

            }
        );

    }

    rollResult.textContent =
        Number.isFinite(roll)
            ? roll
            : "—";

}


/* ============================================================
   ROLL OPTIONS
   ============================================================ */

function handleRollOptions() {

    const state =
        State.getGameState();

    chunkArea.innerHTML = "";

    chunkArea.classList.remove(
        "visible"
    );

    splitButton.classList.remove(
        "visible"
    );

    UI.selectedChunk =
        null;

    if (
        state.lastRoll === 8
    ) {

        splitButton.classList.add(
            "visible"
        );

    }

    /*
     * If the engine exposes selectable roll chunks,
     * display them.
     */

    if (
        typeof Core.selectRoll ===
        "function"
    ) {

        const chunks =
            state.splitMoves?.length
                ? state.splitMoves
                : [state.lastRoll];

        chunks.forEach(
            (chunk, index) => {

                if (
                    !Number.isFinite(chunk)
                ) {

                    return;

                }

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "chunk-button";

                button.textContent =
                    `Use ${chunk}`;

                button.dataset.chunk =
                    chunk;

                button.addEventListener(
                    "click",
                    () => {

                        selectRollChunk(
                            chunk
                        );

                    }
                );

                chunkArea.appendChild(
                    button
                );

            }
        );

        if (
            chunkArea.children.length > 0
        ) {

            chunkArea.classList.add(
                "visible"
            );

        }

    }

    rollButton.disabled =
        true;

}


/* ============================================================
   SELECT ROLL CHUNK
   ============================================================ */

function selectRollChunk(
    chunk
) {

    try {

        const result =
            Core.selectRoll(
                chunk
            );

        if (
            result === false
        ) {

            setStatus(
                "That roll chunk cannot be selected.",
                "warning"
            );

            return;

        }

        UI.selectedChunk =
            chunk;

        document
            .querySelectorAll(
                ".chunk-button"
            )
            .forEach(
                button => {

                    button.classList.toggle(
                        "selected",
                        Number(
                            button.dataset.chunk
                        ) === chunk
                    );

                }
            );

        setStatus(
            `Roll ${chunk} selected. Choose a piece.`,
            "success"
        );

        render();

        highlightMovablePieces();

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message ||
            "Unable to select that roll.",
            "error"
        );

    }

}


/* ============================================================
   SPLIT 8
   ============================================================ */

function handleSplit() {

    const state =
        State.getGameState();

    if (
        state.lastRoll !== 8
    ) {

        setStatus(
            "Only an 8 can be split.",
            "warning"
        );

        return;

    }

    try {

        const result =
            Core.splitEight();

        if (
            result === false
        ) {

            setStatus(
                "This 8 cannot be split right now.",
                "warning"
            );

            return;

        }

        splitButton.classList.remove(
            "visible"
        );

        chunkArea.classList.add(
            "visible"
        );

        setStatus(
            "8 split into 4 + 4. Resolve the first 4.",
            "success"
        );

        render();

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message ||
            "Unable to split the 8.",
            "error"
        );

    }

}


/* ============================================================
   INITIAL ENTRY / COMEBACK
   ============================================================

   These are exposed through the engine.

   If the engine reports an entry/comeback action through its
   available-action API, the relevant inactive/never-active
   pieces are made selectable here.
   ============================================================ */

function handleSpecialActions() {

    const state =
        State.getGameState();

    if (
        !state.hasRolled ||
        state.gameOver
    ) {

        return;

    }

    const player =
        state.players[
            state.currentPlayer
        ];

    if (!player) {
        return;
    }

    player.pieces.forEach(
        piece => {

            const element =
                document.querySelector(
                    `.piece[data-player="${state.currentPlayer}"][data-piece-id="${piece.id}"]`
                );

            /*
             * Never-activated pieces aren't rendered on the board,
             * so entry UI is handled through action buttons below
             * when supported by the core.
             */

        }
    );

}


/* ============================================================
   POST ACTION
   ============================================================ */

function handlePostAction() {

    const state =
        State.getGameState();

    if (
        state.gameOver
    ) {

        showResult();

        return;

    }

    /*
     * If the current roll still has a legal continuation,
     * keep the current player active.
     */

    if (
        state.hasRolled
    ) {

        highlightMovablePieces();

        return;

    }

    rollButton.disabled =
        false;

    setStatus(
        `${PLAYER_COLORS[state.currentPlayer].name}'s turn. Cast the gavva.`,
        ""
    );

    render();

}


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(
    message,
    type = ""
) {

    statusBox.textContent =
        message;

    statusBox.className =
        "status-box";

    if (type) {

        statusBox.classList.add(
            type
        );

    }

}


/* ============================================================
   TURN DISPLAY
   ============================================================ */

function renderTurn() {

    const state =
        State.getGameState();

    const color =
        state.currentPlayer;

    turnIndicator.textContent =
        state.gameOver
            ? "Game Complete"
            : `${PLAYER_COLORS[color].name}'s turn`;

    turnIndicator.dataset.player =
        color;

}


/* ============================================================
   CORE PIECE COUNTS
   ============================================================ */

function render() {

    renderPlayers();

    renderPieces();

    renderTurn();

    highlightMovablePieces();

    /*
     * Re-enable rolling only when the current turn is ready
     * for a new cast.
     */

    const state =
        State.getGameState();

    rollButton.disabled =
        !state.started ||
        state.gameOver ||
        state.hasRolled;

}


/* ============================================================
   START GAME
   ============================================================ */

function startGame() {

    try {

        Core.startGame();

        UI.gameStarted =
            true;

        startOverlay.classList.add(
            "hidden"
        );

        resultOverlay.classList.remove(
            "visible"
        );

        UI.lastRoll =
            null;

        UI.lastCoins =
            [];

        rollResult.textContent =
            "—";

        renderGavva(
            [],
            null
        );

        setStatus(
            "Game started. Red begins.",
            "success"
        );

        render();

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message ||
            "Unable to start the game.",
            "error"
        );

    }

}


/* ============================================================
   NEW GAME
   ============================================================ */

function newGame() {

    try {

        State.resetGameState();

        UI.gameStarted =
            false;

        UI.lastRoll =
            null;

        UI.lastCoins =
            [];

        UI.selectedChunk =
            null;

        resultOverlay.classList.remove(
            "visible"
        );

        startOverlay.classList.remove(
            "hidden"
        );

        rollResult.textContent =
            "—";

        renderGavva(
            [],
            null
        );

        buildBoard();

        render();

        setStatus(
            "Start a new game.",
            ""
        );

    } catch (error) {

        console.error(
            error
        );

    }

}


/* ============================================================
   RESULT / RANKING
   ============================================================ */

function showResult() {

    const state =
        State.getGameState();

    winnerMessage.innerHTML =
        `
        <p>
            All four pieces have reached the Core.
        </p>
        `;

    rankingElement.innerHTML = "";

    const ranked =
        [...State.PLAYERS]
            .sort(
                (a, b) => {

                    const pa =
                        state.players[a];

                    const pb =
                        state.players[b];

                    return (
                        pb.corePieces -
                        pa.corePieces
                    );

                }
            );

    ranked.forEach(
        (color, index) => {

            const player =
                state.players[color];

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "ranking-row";

            row.innerHTML =
                `
                <span>
                    ${index + 1}.
                    ${PLAYER_COLORS[color].name}
                </span>

                <strong>
                    ${player.corePieces}/4
                </strong>
                `;

            rankingElement.appendChild(
                row
            );

        }
    );

    resultOverlay.classList.add(
        "visible"
    );

}


/* ============================================================
   PLAYER COUNT SELECTION
   ============================================================ */

document
    .querySelectorAll(
        "#player-count button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            "#player-count button"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );

                    button.classList.add(
                        "selected"
                    );

                    UI.selectedPlayerCount =
                        Number(
                            button.dataset.count
                        );

                }
            );

        }
    );


/* ============================================================
   BUTTON EVENTS
   ============================================================ */

rollButton.addEventListener(
    "click",
    handleRoll
);

splitButton.addEventListener(
    "click",
    handleSplit
);

document
    .getElementById(
        "start-game-button"
    )
    .addEventListener(
        "click",
        startGame
    );

document
    .getElementById(
        "new-game-button"
    )
    .addEventListener(
        "click",
        newGame
    );

document
    .getElementById(
        "result-new-game-button"
    )
    .addEventListener(
        "click",
        newGame
    );


/* ============================================================
   ENGINE VALIDATION
   ============================================================ */

function validateEngine() {

    const errors = [];

    if (!State) {

        errors.push(
            "AstaChammaState is unavailable."
        );

    }

    if (!Coins) {

        errors.push(
            "AstaChammaCoins is unavailable."
        );

    }

    if (!Rules) {

        errors.push(
            "AstaChammaRules is unavailable."
        );

    }

    if (!Gameplay) {

        errors.push(
            "AstaChammaGameplay is unavailable."
        );

    }

    if (!Core) {

        errors.push(
            "AstaChammaCore is unavailable."
        );

    }

    if (
        errors.length
    ) {

        console.error(
            "AstaChamma engine validation failed:",
            errors
        );

        setStatus(
            "Engine failed to load. Check the JavaScript files.",
            "error"
        );

        return false;

    }

    /*
     * Validate the finalized Gavva mapping if exposed.
     */

    if (
        Coins &&
        Coins.ROLL_MAP
    ) {

        const expected = {

            0: 8,
            1: 1,
            2: 2,
            3: 3,
            4: 4,
            5: 8

        };

        Object.keys(expected)
            .forEach(
                key => {

                    if (
                        Coins.ROLL_MAP[key] !==
                        expected[key]
                    ) {

                        errors.push(
                            `Incorrect Gavva mapping for ${key}.`
                        );

                    }

                }
            );

    }

    /*
     * Validate 8 → 4+4.
     */

    if (
        Rules &&
        typeof Rules.getSplitRoll ===
        "function"
    ) {

        const split =
            Rules.getSplitRoll(8);

        if (
            !Array.isArray(split) ||
            split.length !== 2 ||
            split[0] !== 4 ||
            split[1] !== 4
        ) {

            errors.push(
                "8 split rule is not 4+4."
            );

        }

    }

    /*
     * Validate King movement.
     */

    if (
        Rules &&
        typeof Rules.getMovementDistance ===
        "function"
    ) {

        const king = {

            type: "king",
            status: 1

        };

        if (
            Rules.getMovementDistance(
                king,
                2
            ) !== 1
        ) {

            errors.push(
                "King 2 → 1 validation failed."
            );

        }

        if (
            Rules.getMovementDistance(
                king,
                4
            ) !== 2
        ) {

            errors.push(
                "King 4 → 2 validation failed."
            );

        }

        if (
            Rules.getMovementDistance(
                king,
                8
            ) !== 4
        ) {

            errors.push(
                "King 8 → 4 validation failed."
            );

        }

        if (
            Rules.getMovementDistance(
                king,
                3
            ) !== 0
        ) {

            errors.push(
                "King odd-roll restriction failed."
            );

        }

    }

    if (
        errors.length
    ) {

        console.warn(
            "AstaChamma engine validation warnings:",
            errors
        );

        return false;

    }

    return true;

}


/* ============================================================
   INITIALIZATION
   ============================================================ */

function initializeUI() {

    buildBoard();

    setupDestinationHandling();

    render();

    validateEngine();

    startOverlay.classList.remove(
        "hidden"
    );

}


/* ============================================================
   START
   ============================================================ */

initializeUI();

</script>
